<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Destinations | Tourist Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/destination.css" />
  <script src="js/config.js" defer></script>
  <script src="js/destination.js" defer></script>
</head>
<body>

  <nav class="nav">
    <a href="main.html" class="nav-brand">✈ Tourist</a>
    <div class="nav-links">
      <a href="main.html" class="nav-link">Home</a>
      <a href="destination.html" class="nav-link active">Destinations</a>
      <a href="plan.html" class="nav-link">Plan Trip</a>
    </div>
  </nav>

  <section class="page-title">
    <div class="page-eyebrow">Plan your perfect trip</div>
    <h2>Where are you headed?</h2>
    <p class="page-subtitle">Tell us your destination, dates, and budget — we'll craft 3 personalised itineraries</p>
  </section>

  <section class="search-container">
    <div class="search-card">
      <div class="nl-field">
        <label><span class="icon">✈️</span> Describe your trip</label>
        <div class="nl-input-wrap">
          <textarea id="nlInput" placeholder="e.g. I want to go to Tokyo from June 10–17 with a $3000 budget" rows="3"></textarea>
          <div class="nl-parse-state" id="parseState"></div>
        </div>
        <div id="searchHistory"></div>
      </div>

      <div class="parsed-summary" id="parsedSummary" style="display:none;">
        <div class="parsed-chip" id="chipCity"></div>
        <div class="parsed-chip" id="chipDates"></div>
        <div class="parsed-chip" id="chipBudget"></div>
        <div class="parsed-chip" id="chipCurrency"></div>
      </div>

      <button class="discover-btn" id="discoverBtn">Generate Itineraries</button>
    </div>
  </section>

</body>
</html>
