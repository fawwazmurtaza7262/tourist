<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Destinations | Tourist Planner</title>
  <link rel="stylesheet" href="/css/destination.css" />
</head>

<body>
  <nav aria-label="Primary" class="nav">
    <a href="main.html" class="nav-link">Home</a>
    <a href="destination.html" class="nav-link">Destinations</a>
    <a href="plan.html" class="nav-link">Plan Trip</a>
  </nav>

  <section class="page-title">
    <h2>Destinations</h2>
    <p class="page-subtitle">Choose your next adventure from our most popular destination</p>

    <div class="search-container">
        <div class="search-card">
          <div class="input-group">
            <div class="field">
              <label><span class="icon">📍</span> Destination City</label>
              <input type="text" placeholder="Where do you want to go?">
            </div>
            <div class="field">
              <label><span class="icon">📅</span> Duration (Days)</label>
              <div class="slider-container">
                <input type="range" min="1" max="30" value="3" class="slider">
                <span class="slider-value">3</span>
              </div>
              <small class="helper-text">3 days</small>
            </div>
          </div>
      
          <div class="input-group">
            <div class="field">
              <label><span class="icon">💲</span> Budget Limit</label>
              <div class="slider-container">
                <input type="range" min="100" max="10000" value="5000" class="slider">
                <span class="slider-value">$5,000</span>
              </div>
              <small class="helper-text">Total budget: $5,000</small>
            </div>
            <div class="field">
              <label><span class="icon">🌐</span> Currency</label>
              <select>
                <option>USD - $</option>
                <option>EUR - €</option>
                <option>GBP - £</option>
              </select>
            </div>
          </div>
      
          <button class="discover-btn">Discover Best Spots</button>
        </div>
      </div>
    </div>
  </section>


</body>
</html>
