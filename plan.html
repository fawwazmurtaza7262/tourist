<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Trip - Tourist Planner</title>
    <link rel="stylesheet" href="/css/plan.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/plan.js"></script>
</head>
<body>

<header>
    <h1>Tourist Planner</h1>
    <nav>
        <a href="main.html">Home</a>
        <a href="destination.html">Destinations</a>
        <a href="plan.html" class="active"><strong>Plan Trip</strong></a>
    </nav>
</header>

<div class="container">

    <div class="itinerary-section">
        <div class="section-header">
            <h2>Your Itinerary</h2>
            <button id="clearAllBtn" class="clear-btn">Clear All</button>
        </div>

        <div id="daysContainer"></div>

        <button id="addDayBtn" class="add-day-btn">+ Add Day</button>

        <!-- MAP SECTION -->
        <div class="map-section" style="margin-top:32px; border-radius:16px; overflow:hidden; border:1px solid #e2e8f0; box-shadow:0 4px 24px rgba(0,0,0,0.06);">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:white; border-bottom:1px solid #e2e8f0;">
                <h3 style="margin:0; font-size:1rem; font-weight:700;">🗺️ Trip Map <span id="mapPinCount" style="font-size:0.75rem; color:#94a3b8; font-weight:400;"></span></h3>
                <button id="mapToggleBtn"
                    style="padding:7px 18px; background:#a8dadc; color:white; border:none; border-radius:20px; font-size:0.82rem; font-weight:600; cursor:pointer; font-family:inherit;">
                    Show Map
                </button>

            </div>
            <div id="mapBody" style="display:none;">
                <div id="tripMap" style="height:420px; width:100%;"></div>
                <div style="display:flex; gap:16px; padding:10px 20px; background:white; border-top:1px solid #e2e8f0; font-size:0.78rem; color:#64748b; flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#2563eb;"></div> Hotel</div>
                    <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#00b4d8;"></div> Attraction</div>
                    <div style="display:flex;align-items:center;gap:6px;"><div style="width:22px;border-top:2px dashed #a8dadc;"></div> Distance line</div>
                </div>
            </div>
        </div>

    </div>

    <div class="sidebar">
        <div class="budget-summary">
            <strong>Budget Tracker</strong><br>
            Remaining: <span id="budgetRemaining">$0</span> / <span id="budgetTotal">$0</span>
        </div>
        

        <h3>Packing Checklist</h3>
        <div><label><input type="checkbox"> Passport</label></div>
        <div><label><input type="checkbox"> Travel Insurance</label></div>
        <div><label><input type="checkbox"> Camera Gear</label></div>
        <div><label><input type="checkbox"> Universal Adapter</label></div>

        <hr>

        <h3>Flight Info</h3>
        <textarea placeholder="Enter flight details here..." style="width:100%; height:60px; border-color:#ddd; border-radius:5px; padding:5px; box-sizing:border-box;"></textarea>
    </div>

</div>

<div id="activityModal" class="modal">
    <div class="modal-content">
      <h2>Add Activity</h2>
  
      <label for="activityDaySelect">Choose Day</label>
      <select id="activityDaySelect" class="modal-input"></select>
  
      <label for="activityTime">Time</label>
      <input id="activityTime" type="text" placeholder="e.g. 9:00 AM" class="modal-input">
  
      <label for="activityName">Activity</label>
      <input id="activityName" type="text" placeholder="e.g. Visit Museum" class="modal-input">
  
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button id="modalConfirm">Add</button>
      </div>
    </div>
  </div>
  

</body>
</html>
