<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Trip | Tourist Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/config.js" defer></script>
  <script src="js/plan.js" defer></script>
</head>
<body>

<header>
  <h1>✈ Tourist</h1>
  <nav>
    <a href="main.html">Home</a>
    <a href="destination.html">Destinations</a>
    <a href="plan.html" class="active">Plan Trip</a>
  </nav>
</header>

<div class="container">
  <div class="itinerary-section">
    <div id="exportArea">
      <div class="section-header">
        <h2>Your Itinerary</h2>
        <button id="clearAllBtn" class="clear-btn">Clear All</button>
        <button id="downloadPdfBtn" class="export-btn">Download PDF</button>
        <button id="downloadWordBtn" class="export-btn">Download Word</button>
      </div>

      <div id="daysContainer"></div>
      <button id="addDayBtn" class="add-day-btn">+ Add Day</button>

      <div class="map-section" style="margin-top:24px; border-radius:16px; overflow:hidden; border:1px solid #EDE3CC;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:white; border-bottom:1px solid #EDE3CC;">
          <h3 style="margin:0; font-size:0.95rem; font-weight:700; font-family:'Playfair Display',serif;">🗺️ Trip Map <span id="mapPinCount" style="font-size:0.72rem; color:#94a3b8; font-weight:400;"></span></h3>
          <button id="mapToggleBtn" style="padding:7px 18px; background:#C4623A; color:white; border:none; border-radius:20px; font-size:0.82rem; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif;">Show Map</button>
        </div>
        <div id="mapBody" style="display:none;">
          <div id="tripMap" style="height:420px; width:100%;"></div>
          <div style="display:flex; gap:16px; padding:10px 20px; background:white; border-top:1px solid #EDE3CC; font-size:0.78rem; color:#64748b; flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#C4623A;"></div> Hotel</div>
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:#D4924A;"></div> Attraction</div>
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:22px;border-top:2px dashed #EDE3CC;"></div> Distance line</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <h3>Packing Checklist</h3>
    <div><label><input type="checkbox"> Passport</label></div>
    <div><label><input type="checkbox"> Travel Insurance</label></div>
    <div><label><input type="checkbox"> Camera Gear</label></div>
    <div><label><input type="checkbox"> Universal Adapter</label></div>
    <hr>
    <h3>Flight Info</h3>
    <textarea placeholder="Enter flight details here..." style="height:80px;"></textarea>
  </div>
</div>

<div id="activityModal" class="modal">
  <div class="modal-content">
    <h2>Add Activity</h2>
    <label for="activityTime">Time</label>
    <input id="activityTime" type="text" placeholder="e.g. 9:00 AM" class="modal-input">
    <label for="activityName">Activity</label>
    <input id="activityName" type="text" placeholder="e.g. Visit Museum" class="modal-input">
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalConfirm">Add Activity</button>
    </div>
  </div>
</div>

</body>
</html>
